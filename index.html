<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha Plumbing - Digital Business Card</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 380px;
      width: 100%;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    /* Logo / Image Styling */
    .logo-img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin: 0 auto 16px auto;
      display: block;
      border-radius: 12px;
    }
    /* Placeholder badge if logo image isn't uploaded yet */
    .logo-placeholder {
      width: 90px;
      height: 90px;
      background: #0284c7;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      margin: 0 auto 16px auto;
    }
    h1 { font-size: 1.6rem; color: #0f172a; margin-bottom: 4px; }
    p.subtitle { font-size: 0.95rem; color: #64748b; margin-bottom: 24px; }
    
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    /* Company Primary Color (Plumbing Blue / Navy Theme) */
    .btn-save { 
      background: #0284c7; 
      color: #ffffff; 
    }
    .btn-save:hover { 
      background: #0369a1; 
    }
    
    .btn-call { 
      background: #f1f5f9; 
      color: #0f172a; 
      border: 1px solid #cbd5e1; 
    }
    .btn-call:hover { 
      background: #e2e8f0; 
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Replace logo.png with your image file after uploading it to GitHub, or leave logo-placeholder -->
    <img src="logo.png" alt="Alpha Plumbing Logo" class="logo-img" onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='flex';">
    <div id="alt-logo" class="logo-placeholder" style="display:none;">AP</div>

    <h1>Alpha Plumbing</h1>
    <p class="subtitle">Professional Plumbing Services</p>

    <div class="btn-group">
      <!-- Save to Contacts Button for iOS & Android -->
      <button class="btn btn-save" onclick="downloadVCard()">📇 Save to Contacts</button>
      
      <!-- Direct Phone Link: CHANGE NUMBER BELOW -->
      <a href="tel:1234567890" class="btn btn-call" id="callLink">📞 Call (123) 456-7890</a>
    </div>
  </div>

  <script>
    // EDIT YOUR DETAILS HERE
    const contactInfo = {
      company: "Alpha Plumbing",
      phone: "(123) 456-7890",      // How you want the phone number displayed
      cleanPhone: "1234567890",      // Digits only
      logoUrl: "https://AlphaP2011.github.io/Alpha-Plumbing-card/logo.png"
    };

    function downloadVCard() {
      // Standard vCard 3.0 format for auto-populating iOS Contacts & Android Contacts
      const vCardData = 
`BEGIN:VCARD
VERSION:3.0
ORG:${contactInfo.company}
FN:${contactInfo.company}
TEL;TYPE=WORK,VOICE:${contactInfo.cleanPhone}
PHOTO;VALUE=URI:${contactInfo.logoUrl}
END:VCARD`;

      const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', `${contactInfo.company}.vcf`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

</body>
</html>
